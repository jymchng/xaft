name: Docs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # --------------------------------------------------------------------------
  # Build docs — always runs (also on PRs to catch doc errors early)
  # --------------------------------------------------------------------------
  build:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mkdocs + material
        run: |
          pip install mkdocs mkdocs-material pymdown-extensions

      - name: Build docs
        run: mkdocs build

      - name: Upload pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # --------------------------------------------------------------------------
  # Deploy to GitHub Pages — only on pushes to main
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable GitHub Pages if it is not already enabled (requires
          # the workflow token to have admin permission on the repo). Without
          # this, the deploy fails with "Get Pages site failed ... Not Found"
          # when Pages has never been turned on in the repo settings.
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
