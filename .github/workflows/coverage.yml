name: Coverage

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Minimum acceptable line coverage, in percent. Passed straight through to
  # cargo-tarpaulin as `--fail-under`, so a regression below this number fails
  # the job.
  #
  # THIS IS CURRENTLY 0, so the job is a *reporting* gate: it measures the
  # workspace on every push but never blocks a merge. The project's target is
  # 85, and `just coverage` in the justfile already enforces it locally. CI
  # cannot, because the tree is still below it — the measurement of record is
  # in docs/coverage-baseline.md, and every line below is chosen to make the
  # gap, and this line's part in closing it, impossible to misread:
  #
  #   * `just coverage` passes the same flags this workflow does. The two are
  #     compared mechanically by scripts/coverage-gate-check.py, which runs
  #     below as a pre-flight, so CI cannot quietly start measuring something
  #     other than what a developer measures locally.
  #   * Setting this to 85 while the tree is below it would mean a red check on
  #     every single commit, which trains contributors to ignore CI rather than
  #     to act on it. The exact size of the remaining gap is printed by the
  #     check below and tracked per batch in docs/coverage-baseline.md; it is
  #     deliberately not restated here, because a number copied into three
  #     files is how the three files start disagreeing.
  #
  # TO ARM THE GATE: once docs/coverage-baseline.md records coverage at or above
  # 85%, change the single line below to `85` and rewrite this comment to state
  # that threshold and the commit which reached it. You do not have to remember
  # to: scripts/coverage-gate-check.py fails — here, in this workflow, before a
  # single instrumented test binary is built — as soon as the recorded
  # measurement reaches the target while this value is still 0, and it prints
  # this instruction. A gate wired but not armed is decorative, and that is the
  # one state this file is not allowed to reach silently.
  COVERAGE_MIN: "0"

jobs:
  # --------------------------------------------------------------------------
  # coverage — cargo-tarpaulin over the whole workspace (LLVM engine)
  # --------------------------------------------------------------------------
  coverage:
    name: cargo tarpaulin --workspace
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check the gate is wired and armed consistently
        # Seconds, not the ~15 minutes the measurement below costs, and it is
        # the difference between "the gate is armed" and "the gate exists".
        #
        # Fails when: the flags here have drifted from `just coverage`; the
        # threshold has been hardcoded a second time instead of coming from
        # env.COVERAGE_MIN; COVERAGE_MIN is armed while the recorded coverage
        # is still below the target; or — the tripwire — the measurement
        # recorded in docs/coverage-baseline.md has reached the target and
        # nobody flipped COVERAGE_MIN.
        #
        # The --self-test runs first because a checker that cannot fail is
        # worse than no checker: it asserts each drift mode above is detected.
        run: |
          python3 scripts/coverage-gate-check.py --self-test
          python3 scripts/coverage-gate-check.py --check

      - name: Install Rust toolchain
        # The LLVM coverage engine instruments via the LLVM profiling runtime,
        # so it needs a nightly toolchain with the llvm-tools-preview component
        # rather than the stable toolchain the other workflows install.
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Measure line coverage
        # `--out Json` writes tarpaulin-report.json whether or not the
        # threshold is met, so a failing run still leaves a report behind to
        # upload and to feed `scripts/uncovered.py`.
        #
        # `--skip-clean` matches `just coverage`; `--timeout 300` bounds any
        # single test binary so a hung test cannot wedge CI forever.
        run: |
          cargo tarpaulin \
            --workspace \
            --engine llvm \
            --timeout 300 \
            --skip-clean \
            --out Json \
            --fail-under "${COVERAGE_MIN}"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tarpaulin-report.json
          if-no-files-found: warn
