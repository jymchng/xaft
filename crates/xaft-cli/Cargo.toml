[package]
name = "xaft-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI entry point for xaft — argument parsing, config loading, tracing init"

[features]
default = ["tui"]
tui = ["dep:xaft-tui"]

[dependencies]
xaft-config  = { workspace = true }
xaft-runtime = { workspace = true }
xaft-session = { path = "../xaft-session" }
xaft-skills  = { path = "../xaft-skills" }
xaft-tui     = { path = "../xaft-tui", optional = true }
tokio        = { workspace = true }
async-trait  = { workspace = true }
clap         = { workspace = true }
clap_complete = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
toml         = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
chrono       = { workspace = true }
dirs         = { workspace = true }
# `xaft trust`: SHA-256 digests of trusted extension files; `xaft worktrees`:
# deterministic worktree ids.
sha2         = "0.10"
# `xaft worktrees`: orchestration, worktree and worker-session ids.
uuid         = { workspace = true }
# `xaft mcp connect/refresh/doctor`: the Streamable HTTP and HTTP+SSE MCP
# transports (the feature set the provider crates already build) and the
# WebSocket transport.
reqwest      = { version = "0.12", features = ["json", "stream"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
