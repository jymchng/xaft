[package]
name = "xaft-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Conversational streaming terminal renderer for xaft"

[dependencies]
# xaft crates
xaft-config  = { workspace = true }
xaft-runtime = { path = "../xaft-runtime" }
xaft-agent   = { path = "../xaft-agent" }
xaft-tools   = { path = "../xaft-tools" }
xaft-session = { path = "../xaft-session", optional = true }
xaft-memory  = { path = "../xaft-memory", optional = true }
xaft-skills  = { path = "../xaft-skills" }

# agtrs framework
agtrs-runtime   = { path = "../../../agtrs/agtrs-runtime" }
agtrs-workspace = { path = "../../../agtrs/agtrs-workspace" }

# Terminal
crossterm = { version = "0.28", features = ["event-stream"] }

# Async
tokio        = { workspace = true }
tokio-util   = "0.7"
async-trait  = { workspace = true }
futures      = "0.3"

# Serialization
serde        = { workspace = true }
serde_json   = { workspace = true }

# Config serialization (for /config command)
toml         = { workspace = true }

# Error handling
thiserror    = { workspace = true }

# Observability
tracing      = { workspace = true }

# Utilities
chrono       = { workspace = true }
dirs         = { workspace = true }
unicode-width = "0.1"
indexmap     = "2"
similar      = "2"
ctrlc        = "3"
base64       = "0.22"
sha2         = "0.10"
hex          = "0.4"
pulldown-cmark = { version = "0.12", optional = true }

[dev-dependencies]
tokio        = { workspace = true }
tempfile     = "3"
tracing-subscriber = { workspace = true }

[features]
default = ["memory", "session", "markdown"]
memory   = ["dep:xaft-memory"]
session  = ["dep:xaft-session"]
markdown = ["dep:pulldown-cmark"]
