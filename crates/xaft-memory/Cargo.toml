[package]
name = "xaft-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Product-level memory system for xaft coding agents — project-scoped, git-aware, tool-integrated"

[dependencies]
# xaft crates
xaft-config  = { workspace = true }
xaft-agent   = { path = "../xaft-agent" }

# Framework memory
agtrs-memory  = { path = "../../../agtrs/agtrs-memory", features = ["sqlite"] }
agtrs-runtime = { path = "../../../agtrs/agtrs-runtime" }

# Async
tokio       = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Observability
tracing = { workspace = true }

# Utilities
chrono = { workspace = true }
uuid   = { workspace = true }
dirs   = "5"

[dev-dependencies]
tokio    = { workspace = true }
tempfile = "3"
# `tests/config_parity.rs` parses a `[memory]` table to prove a configured TTL
# survives the real loader, rather than only being settable in Rust.
serde    = { workspace = true }
toml     = { workspace = true }
