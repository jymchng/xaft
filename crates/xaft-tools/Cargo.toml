[package]
name = "xaft-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Built-in tool implementations for xaft — file system, git, and shell operations"

[dependencies]
# xaft crates
xaft-config  = { workspace = true }

# agtrs framework
agtrs-runtime   = { path = "../../../agtrs/agtrs-runtime" }
agtrs-workspace = { path = "../../../agtrs/agtrs-workspace" }
agtrs-git       = { path = "../../../agtrs/agtrs-git" }
agtrs-shell     = { path = "../../../agtrs/agtrs-shell" }

# Async
tokio        = { workspace = true }
async-trait  = { workspace = true }
futures      = "0.3"

# Serialization
serde        = { workspace = true }
serde_json   = { workspace = true }

# Error handling
thiserror    = { workspace = true }

# Observability
tracing      = { workspace = true }

# Utilities
chrono           = { workspace = true }
tokio-util       = "0.7"
async-recursion  = "1"
glob             = "0.3"
similar          = "2"
diffy            = "0.4"

# Hashing for the `checksum_file` parity tool (agenthicc uses hashlib, which
# names these the same way). All three are already in Cargo.lock via
# transitive dependencies, so this adds no new packages to the graph.
sha2             = "0.10"
sha1             = "0.10"
md-5             = "0.10"

# Direct access to POSIX process-group APIs (`libc::killpg`, `libc::kill`,
# `libc::SIGKILL`/`libc::SIGINT`) used by the terminal manager. Already in
# Cargo.lock via transitive dependencies, so this adds no new packages.
libc             = "0.2"

# Redaction of credential-shaped text before it reaches the durable terminal
# store (agenthicc `_SECRET_FLAGS` / `_SECRET_ASSIGNMENT`). Already a workspace
# dependency of `xaft-config`, so this adds no new package.
regex            = { workspace = true }

[dev-dependencies]
tokio        = { workspace = true }
tempfile     = "3"
uuid         = { workspace = true }
injectable-rs-runtime = { path = "../../../injectable/injectable-rs-runtime" }
tracing-subscriber = { workspace = true }
