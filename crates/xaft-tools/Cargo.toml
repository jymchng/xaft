[package]
name = "xaft-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Built-in tool implementations for xaft — file system, git, and shell operations"

[dependencies]
# xaft crates
xaft-config  = { workspace = true }

# agtrs framework
agtrs-runtime   = { path = "../../../agtrs/agtrs-runtime" }
agtrs-workspace = { path = "../../../agtrs/agtrs-workspace" }
agtrs-git       = { path = "../../../agtrs/agtrs-git" }
agtrs-shell     = { path = "../../../agtrs/agtrs-shell" }

# Async
tokio        = { workspace = true }
async-trait  = { workspace = true }
futures      = "0.3"

# Serialization
serde        = { workspace = true }
serde_json   = { workspace = true }

# Error handling
thiserror    = { workspace = true }

# Observability
tracing      = { workspace = true }

# Utilities
chrono           = { workspace = true }
tokio-util       = "0.7"
async-recursion  = "1"
glob             = "0.3"
similar          = "2"
diffy            = "0.4"

# Hashing for the `checksum_file` parity tool (agenthicc uses hashlib, which
# names these the same way). All three are already in Cargo.lock via
# transitive dependencies, so this adds no new packages to the graph.
sha2             = "0.10"
sha1             = "0.10"
md-5             = "0.10"

# Direct access to POSIX process-group APIs (`libc::killpg`, `libc::kill`,
# `libc::SIGKILL`/`libc::SIGINT`) used by the terminal manager. Already in
# Cargo.lock via transitive dependencies, so this adds no new packages.
libc             = "0.2"

# Redaction of credential-shaped text before it reaches the durable terminal
# store (agenthicc `_SECRET_FLAGS` / `_SECRET_ASSIGNMENT`). Already a workspace
# dependency of `xaft-config`, so this adds no new package.
regex            = { workspace = true }

# Browser automation (parity rows 60-77, `browser/`). xaft drives Chromium over
# the Chrome DevTools Protocol itself rather than through a generated binding:
# the pipe transport needs nothing new, and the operator-supplied `cdp`
# transport needs only a plain `ws://` client. 0.24 is pinned because it is the
# release whose dependency set (rand 0.8, thiserror 1, http 1, sha1) is already
# in the lockfile — it adds four small packages, not a second rand/thiserror
# generation. No TLS feature: a CDP endpoint is loopback-only by validation.
tokio-tungstenite = "0.24"
# WHATWG URL parsing for the destination policy. Chromium parses URLs by the
# same standard, so a host the policy approves is the host the browser visits —
# a hand-rolled or Python-style splitter is a parser differential away from a
# bypass (`http://evil.example\@allowed.example/`). Already in the lockfile.
url              = "2"
# Screenshot payloads arrive base64-encoded over CDP. Already in the lockfile.
base64           = "0.22"
# Ephemeral (non-persistent) browser profiles live in a self-deleting temp dir.
# Already a dev-dependency, so this adds no new package.
tempfile         = "3"
# Opaque page, artifact and browser-session ids. Already a workspace dependency.
uuid             = { workspace = true }

[dev-dependencies]
tokio        = { workspace = true }
tempfile     = "3"
toml         = { workspace = true }
uuid         = { workspace = true }
injectable-rs-runtime = { path = "../../../injectable/injectable-rs-runtime" }
tracing-subscriber = { workspace = true }
