[package]
name = "xaft-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Runtime orchestration for xaft — boots and drives agent execution"

[dependencies]
# xaft crates
xaft-config   = { workspace = true }
xaft-tools    = { path = "../xaft-tools" }
xaft-agent    = { path = "../xaft-agent" }
xaft-agents   = { path = "../xaft-agents" }
xaft-memory   = { path = "../xaft-memory", optional = true }
xaft-skills   = { path = "../xaft-skills" }
# Session MCP servers: the manager, its transports and the mcp__ tools.
xaft-mcp      = { workspace = true }

# agtrs framework
agtrs-runtime          = { path = "../../../agtrs/agtrs-runtime" }
agtrs-workspace        = { path = "../../../agtrs/agtrs-workspace" }
agtrs-git              = { path = "../../../agtrs/agtrs-git" }
agtrs-shell            = { path = "../../../agtrs/agtrs-shell" }
agtrs-anthropic        = { path = "../../../agtrs/agtrs-anthropic" }
agtrs-openai           = { path = "../../../agtrs/agtrs-openai" }
agtrs-providers-router = { path = "../../../agtrs/agtrs-providers-router" }

# injectable DI
injectable-rs-runtime = { path = "../../../injectable/injectable-rs-runtime" }

# Async
tokio        = { workspace = true }
async-trait  = { workspace = true }
futures      = "0.3"
tokio-util   = "0.7"
tokio-stream  = "0.1"
async-stream  = "0.3"

# Serialization
serde        = { workspace = true }
schemars     = "0.8"
serde_json   = { workspace = true }

# Error handling
thiserror    = { workspace = true }
anyhow       = { workspace = true }

# Observability
tracing      = { workspace = true }

# Utilities
uuid         = { workspace = true }
chrono       = { workspace = true }
regex        = { workspace = true }
toml         = { workspace = true }
# HTTP and SHA-256 serve two features: the NameThatUI catalog fetch
# (ui_catalog group) and content-addressed reconstruct_site evidence, and
# account sign-in (`auth`, parity rows 54-56: the OAuth token, revocation and
# userinfo calls, PKCE's SHA-256). Same version and features xaft-skills and
# xaft-tools already build, so no second copy is compiled. Sign-in also needs
# URL-safe base64, OS randomness for the verifier and `state`, and the home
# directory for `$XAFT_HOME/auth.json`. All already in Cargo.lock.
reqwest      = { version = "0.12", features = ["json", "stream"] }
sha2         = "0.10"
base64       = "0.22"
getrandom    = "0.2"
dirs         = { workspace = true }

[dev-dependencies]
tokio        = { workspace = true }
tempfile     = "3"
tracing-subscriber = { workspace = true }
xaft-tui     = { path = "../xaft-tui" }

[features]
default = ["memory"]
memory = ["dep:xaft-memory"]
