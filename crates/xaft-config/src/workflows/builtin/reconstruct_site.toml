# reconstruct_site — reconstruct a reference website as a modern Next.js +
# Tailwind + shadcn/ui + TanStack Query app through explicit agent-controlled
# phases.
#
# Port of agenthicc's `workflows/reconstruct_site/` (runner.py, phase_impl.py,
# evidence_plan.py, evidence.py, research.py). The 41 phases below are the
# authoritative plan in canonical order; their `next` edges are the full
# `production` graph. The `reconstruct_site` effect owns everything that
# drives control flow:
# * profiles — init fixes the run's profile: the `profile` param, else
#   `static` for a static reference and `application` otherwise. Every forward
#   transition routes to the next phase OF THAT PROFILE (static: 20 phases,
#   application: 21 with data_layer, production: all 41, custom: the validated
#   `custom_phases` list), so excluded phases are never entered;
# * the page loop — recon fixes the routes (the desired routes, else "/") and
#   `page` runs once per route ({state.page_route}, {state.page_number} of
#   {state.page_count});
# * the research gate — entering research_gate publishes a content-addressed
#   fidelity baseline; approval must cite its id (shown in the
#   [EVIDENCE DIGEST]); bootstrap cannot start until the gate approved;
# * controlled re-entry — the gate's rejection and the validation phases'
#   rejections re-enter any phase of the active profile (`max_reentries`,
#   default 3), staling that phase's and every downstream phase's evidence and
#   reopening the gate for research targets; an empty target retries here;
# * verify_* rejections retry the verify phase; final_blocked ends the run
#   early with the blocker (agenthicc's terminal BLOCKED, status `exited`).
# Evidence lives in .xaft/reconstruct_site/<run-id>/ (manifest, per-phase
# artifacts and receipts, gate artifacts, screenshot links);
# record_reconstruct_screenshot (the `reconstruct` tool group) links
# playwright/cloakbrowser screenshots into it.
#
# Faithful to the runner: five attempts per phase with its reminders, Yolo
# mode and the auto agent throughout, the plan's turn budgets, and its model
# knobs — `<phase>_model`, the `phase_models` table, and the aliases below
# (`visual_model`, `interaction_model`, `assets_model`, `design_model`,
# `shell_model`, `components_model`, `data_model`, `responsive_model`,
# `fidelity_model`, `final_model`). Other params: `profile`, `custom_phases`
# (list or comma string), `max_reentries`, `viewports` /
# `research_viewports`.
#
# Simplified: the PRD-178 coverage matrix (typed route × viewport × state
# observation cells) is not ported — agenthicc's research tools submit only
# summaries, which puts its gate in the summary-only mode implemented here for
# every profile; resume does not re-verify evidence hashes. Retrying phases
# (the gate, validation and verify phases) allow 20 entries and `page` 1000,
# bounds agenthicc does not have. The phase counter shows the 41 declared
# phases (agenthicc counts the profile's 20, 21 or 41 and shows `page i/n`). Added: the `infra_artifacts_present` guard
# refuses a *_verified call while the files its build phase was told to create
# are missing (Dockerfile + compose files, netlify.toml, Caddyfile,
# prisma/schema.prisma, the four .env files, the package.json scripts,
# scripts/*.sh + docs/scripts.md, docs/*.md; verify_sqlite has no fixed file).
name = "reconstruct_site"
description = "Reconstruct a reference website as a modern Next.js + Tailwind + shadcn/ui + TanStack Query app through explicit agent-controlled phases."
mode = "phased"
mode_bindings = []
stable_system_prompt = """
[CACHE-STABLE WORKFLOW POLICY]
Keep this workflow contract unchanged across phases. Ask the user a focused
clarifying question through the existing `ask_user` tool whenever required
information is missing, ambiguous, or would materially change the result.
Wait for the answer; do not guess. Use the parent session's workspace scope
and workspace access policy for every filesystem, mention, Git, browser, and
command-working-directory access; never construct a second workspace scope,
allow-list, or unrestricted sandbox inside this workflow. Actual questions and
answers, phase state, and artifacts are dynamic context and do not belong here."""

[[phases]]
name = "init"
agent_type = "auto"
max_turns = 10
max_attempts = 5
next = "recon"
mode_override = "yolo"
extra_tools = ["reconstruct"]
system_prompt = """
You are in the INIT phase of reconstruct_site. Collect the initial workflow state: reference_url, target_directory, project constraints, desired routes, auth requirements, whether the reference is static or dynamic, and whether API behaviour should be reproduced or mocked. Also confirm allowed domains, route inclusion/exclusion, treatment of live/personalized content, unavailable-state handling, and accepted fidelity exceptions. Never place credentials in these fields. Verify the reference is accessible (browser tools). Ask the user via ask_user if required inputs are missing. Then call submit_initial_state(reference_url, target_directory, constraints, desired_routes, auth_required, reference_is_static, reproduce_api_or_mock, allowed_domains, route_inclusion, route_exclusion, dynamic_content_policy, unavailable_behavior, fidelity_exceptions). Only a successful transition-tool call changes phase; prose such as 'done' never advances the workflow. Do NOT start coding yet. First write the initial state you are submitting to the required research Markdown file, then call the transition tool.

MANDATORY RESEARCH NOTES: before calling the phase transition tool, use the normal workspace `write_file` tool to write substantive Markdown findings under `<output_dir>/research/initial_state/`. At minimum create `<output_dir>/research/initial_state/initial-state.md`; add more Markdown files when the findings are too large for one document. Include concrete observations, evidence or source references, uncertainties, and implications for implementation. Do not leave findings only in conversation text or transition-tool arguments. The phase transition tool records the handoff but does not create or validate these research files."""
prompt = """
{intent}"""
continuation_prompt = "Call submit_initial_state(...) now."

[[phases.transitions]]
tool = "submit_initial_state"
description = "Record the initial workflow state and advance to reconnaissance."
effect = "reconstruct_site"
params = [
  { name = "reference_url", description = "The reference website URL to reconstruct." },
  { name = "target_directory", description = "Directory where the Next.js app will be created." },
  { name = "constraints", required = false, description = "Project constraints (stack, conventions, exclusions)." },
  { name = "desired_routes", required = false, description = "Comma-separated routes the user wants (may be empty)." },
  { name = "auth_required", type = "boolean", required = false, description = "Whether the reference has authentication UI (default false)." },
  { name = "reference_is_static", type = "boolean", required = false, description = "Whether the reference is static or dynamic (default true)." },
  { name = "reproduce_api_or_mock", required = false, description = "'reproduce' or 'mock' for API behaviour (default mock)." },
  { name = "allowed_domains", type = "array", items = "string", required = false, description = "Domains the browser is authorized to visit. This is scope metadata only; the configured network policy remains authoritative." },
  { name = "route_inclusion", type = "array", items = "string", required = false, description = "Optional route patterns to include." },
  { name = "route_exclusion", type = "array", items = "string", required = false, description = "Optional route patterns to exclude." },
  { name = "dynamic_content_policy", required = false, description = "How live, personalized, or randomized content should be represented (default observe)." },
  { name = "unavailable_behavior", required = false, description = "Whether inaccessible states are reported or represented with an explicitly approved fixture/mock (default report)." },
  { name = "fidelity_exceptions", required = false, description = "User-approved fidelity limitations." },
]

[[phases]]
name = "recon"
agent_type = "auto"
max_turns = 35
max_attempts = 5
next = "visual_research"
mode_override = "yolo"
extra_tools = ["reconstruct"]
system_prompt = """
You are in the RECON phase of reconstruct_site. Thoroughly inspect the reference website with the browser tools: homepage, every discoverable route, navigation, footer, menus, dropdowns, modals, forms, search, filters, tabs, cards, tables, pagination, loading/error/empty states, auth UI, responsive behaviour, interactive elements. Build a route inventory (route, purpose, layout, major components, interactions, data requirements, responsive considerations) and record the site's information architecture. Then call submit_route_inventory(summary). Only a successful transition-tool call changes phase; prose never advances the workflow. Do NOT start coding — this is discovery only.

MANDATORY RESEARCH NOTES: before calling the phase transition tool, use the normal workspace `write_file` tool to write substantive Markdown findings under `{state.target_directory}/research/reconnaissance/`. At minimum create `{state.target_directory}/research/reconnaissance/route-inventory.md`; add more Markdown files when the findings are too large for one document. Include concrete observations, evidence or source references, uncertainties, and implications for implementation. Do not leave findings only in conversation text or transition-tool arguments. The phase transition tool records the handoff but does not create or validate these research files.

{state.evidence_digest}"""
prompt = """
Reference URL: {state.reference_url}

Perform reconnaissance."""
continuation_prompt = "Call submit_route_inventory(summary) now."

[[phases.transitions]]
tool = "submit_route_inventory"
description = "Record the route-inventory handoff and advance to visual research."
effect = "reconstruct_site"
params = [
  { name = "summary", description = "Short description of the findings written to the reconnaissance Markdown files." },
]

[[phases]]
name = "visual_research"
agent_type = "auto"
max_turns = 30
max_attempts = 5
next = "interaction_analysis"
mode_override = "yolo"
model_param = "visual_model"
extra_tools = ["reconstruct"]
system_prompt = """
You are in the VISUAL_RESEARCH phase of reconstruct_site. Capture reference screenshots for every major route at mobile, tablet, and desktop viewports when browser access is available. After each playwright_screenshot or cloakbrowser_screenshot call, pass its returned artifact id and path to record_reconstruct_screenshot with role 'reference', route, viewport, dimensions, and page state. Then analyse the reference's typography (sizes/weights/line-heights), spacing, containers, grid systems, colors, borders, shadows, radii, iconography, image treatment, navigation, cards, buttons, forms, tables, overlays, and responsive layouts. Extract CONCRETE measured observations (e.g. max-width ≈ X, card radius ≈ X, padding ≈ Y) — never vague 'clean modern design'. Then call submit_visual_spec(summary). Only a successful transition-tool call changes phase; prose never advances the workflow.

MANDATORY RESEARCH NOTES: before calling the phase transition tool, use the normal workspace `write_file` tool to write substantive Markdown findings under `{state.target_directory}/research/visual/`. At minimum create `{state.target_directory}/research/visual/visual-observations.md`; add more Markdown files when the findings are too large for one document. Include concrete observations, evidence or source references, uncertainties, and implications for implementation. Do not leave findings only in conversation text or transition-tool arguments. The phase transition tool records the handoff but does not create or validate these research files.

{state.evidence_digest}"""
prompt = """
Reference URL: {state.reference_url}

Capture screenshots and measure the visual design."""
continuation_prompt = "Call submit_visual_spec(summary) now."

[[phases.transitions]]
tool = "submit_visual_spec"
description = "Record the visual-research handoff and advance."
effect = "reconstruct_site"
params = [
  { name = "summary", description = "Short description of the measured findings written to the visual-research Markdown files." },
]

[[phases]]
name = "interaction_analysis"
agent_type = "auto"
max_turns = 30
max_attempts = 5
next = "content_assets"
mode_override = "yolo"
model_param = "interaction_model"
extra_tools = ["reconstruct"]
system_prompt = """
You are in the INTERACTION_ANALYSIS phase of reconstruct_site. Determine how the website actually behaves: hover/focus/active states, dropdown behaviour, navigation transitions, modals, drawers, accordions, tabs, carousels, forms and validation, loading states, API requests, infinite scrolling, pagination, URL state, query parameters, animations, keyboard interactions. Document each as: interaction, trigger, expected behaviour, visual state, data dependency, URL/state change. Reproduce the EXPERIENCE, not just the static appearance. Then call submit_interaction_inventory(summary). Only a successful transition-tool call changes phase; prose never advances the workflow.

MANDATORY RESEARCH NOTES: before calling the phase transition tool, use the normal workspace `write_file` tool to write substantive Markdown findings under `{state.target_directory}/research/interaction/`. At minimum create `{state.target_directory}/research/interaction/interaction-analysis.md`; add more Markdown files when the findings are too large for one document. Include concrete observations, evidence or source references, uncertainties, and implications for implementation. Do not leave findings only in conversation text or transition-tool arguments. The phase transition tool records the handoff but does not create or validate these research files.

{state.evidence_digest}"""
prompt = """
Reference URL: {state.reference_url}

Analyse how the site actually behaves."""
continuation_prompt = "Call submit_interaction_inventory(summary) now."

[[phases.transitions]]
tool = "submit_interaction_inventory"
description = "Record the interaction-analysis handoff and advance."
effect = "reconstruct_site"
params = [
  { name = "summary", description = "Short description of the behaviour findings written to the interaction-analysis Markdown files." },
]

[[phases]]
name = "content_assets"
agent_type = "auto"
max_turns = 25
max_attempts = 5
next = "responsive_research"
mode_override = "yolo"
model_param = "assets_model"
extra_tools = ["reconstruct"]
system_prompt = """
You are in the CONTENT_ASSETS phase of reconstruct_site. Inventory logos, icons, images, illustrations, fonts, videos, SVGs, backgrounds, badges, avatars, and placeholder assets. Measure real dimensions and formats — never invent them. Classify each asset as reusable legitimately or to be recreated (note the legal basis), and identify an equivalent or implementation strategy for assets that must not be copied. Then call submit_asset_inventory(summary). Only a successful transition-tool call changes phase; prose never advances the workflow.

MANDATORY RESEARCH NOTES: before calling the phase transition tool, use the normal workspace `write_file` tool to write substantive Markdown findings under `{state.target_directory}/research/content_assets/`. At minimum create `{state.target_directory}/research/content_assets/asset-inventory.md`; add more Markdown files when the findings are too large for one document. Include concrete observations, evidence or source references, uncertainties, and implications for implementation. Do not leave findings only in conversation text or transition-tool arguments. The phase transition tool records the handoff but does not create or validate these research files.

{state.evidence_digest}"""
prompt = """
Reference URL: {state.reference_url}

Inventory content and assets."""
continuation_prompt = "Call submit_asset_inventory(summary) now."

[[phases.transitions]]
tool = "submit_asset_inventory"
description = "Record the content/assets research handoff and advance."
effect = "reconstruct_site"
params = [
  { name = "summary", description = "Short description of the inventory written to the content-assets Markdown files." },
]

[[phases]]
name = "responsive_research"
agent_type = "auto"
max_turns = 30
max_attempts = 5
next = "architecture"
mode_override = "yolo"
extra_tools = ["reconstruct"]
system_prompt = """
You are in the RESPONSIVE_RESEARCH phase of reconstruct_site. Study the same reference surfaces at every configured viewport. Record breakpoint intervals, reflow/order/alignment, visibility and drawer changes, text wrapping/truncation, image cropping, overflow, sticky elements, touch targets, reduced-motion behavior, and safe-area details. Use screenshots and measured observations when browser access is available. Do not implement anything and do not infer mobile behavior from desktop alone. Then call submit_responsive_research(summary). Only a successful transition-tool call changes phase; prose never advances.

MANDATORY RESEARCH NOTES: before calling the phase transition tool, use the normal workspace `write_file` tool to write substantive Markdown findings under `{state.target_directory}/research/responsive/`. At minimum create `{state.target_directory}/research/responsive/responsive-observations.md`; add more Markdown files when the findings are too large for one document. Include concrete observations, evidence or source references, uncertainties, and implications for implementation. Do not leave findings only in conversation text or transition-tool arguments. The phase transition tool records the handoff but does not create or validate these research files.

{state.evidence_digest}"""
prompt = """
Reference URL: {state.reference_url}

Compare every surface across mobile, tablet, and desktop viewports."""
continuation_prompt = "Call submit_responsive_research(summary) now."

[[phases.transitions]]
tool = "submit_responsive_research"
description = "Record the responsive-research handoff and advance."
effect = "reconstruct_site"
params = [
  { name = "summary", description = "Short description of the breakpoint and viewport findings written to the responsive-research Markdown files." },
]

[[phases]]
name = "architecture"
agent_type = "auto"
max_turns = 25
max_attempts = 5
next = "design_system"
mode_override = "yolo"
extra_tools = ["reconstruct"]
system_prompt = """
You are in the ARCHITECTURE phase of reconstruct_site. Design the target Next.js App Router application: server vs client components, route structure, layouts, loading boundaries, error boundaries, data-fetching architecture, TanStack Query keys, API abstraction, state management, reusable components, and shared UI primitives. Write the architecture document, then call submit_architecture(summary). Only a successful transition-tool call changes phase; prose never advances the workflow.

MANDATORY RESEARCH NOTES: before calling the phase transition tool, use the normal workspace `write_file` tool to write substantive Markdown findings under `{state.target_directory}/research/architecture/`. At minimum create `{state.target_directory}/research/architecture/architecture.md`; add more Markdown files when the findings are too large for one document. Include concrete observations, evidence or source references, uncertainties, and implications for implementation. Do not leave findings only in conversation text or transition-tool arguments. The phase transition tool records the handoff but does not create or validate these research files.

{state.evidence_digest}"""
prompt = """
Design the target Next.js application architecture before implementation."""
continuation_prompt = "Call submit_architecture(summary) now."

[[phases.transitions]]
tool = "submit_architecture"
description = "Record the architecture-research handoff and advance."
effect = "reconstruct_site"
params = [
  { name = "summary", description = "Short description of the architecture decisions written to the architecture Markdown files." },
]

[[phases]]
name = "design_system"
agent_type = "auto"
max_turns = 25
max_attempts = 5
next = "research_gate"
mode_override = "yolo"
model_param = "design_model"
extra_tools = ["reconstruct"]
system_prompt = """
You are in the DESIGN_SYSTEM phase of reconstruct_site. Translate the reference website's visual language into a reusable design system: typography scale, spacing scale, colors, borders, radius, shadows, breakpoints, container widths, button variants, input styles, card styles, navigation styles. Map reusable UI elements onto customized shadcn/ui primitives (never default styling) so the result matches the reference. Follow the pipeline: reference design → design tokens → Tailwind configuration / CSS variables → shadcn/ui primitives → reusable application components. Then call submit_design_system(summary). Only a successful transition-tool call changes phase; prose never advances the workflow.

MANDATORY RESEARCH NOTES: before calling the phase transition tool, use the normal workspace `write_file` tool to write substantive Markdown findings under `{state.target_directory}/research/design_system/`. At minimum create `{state.target_directory}/research/design_system/design-system.md`; add more Markdown files when the findings are too large for one document. Include concrete observations, evidence or source references, uncertainties, and implications for implementation. Do not leave findings only in conversation text or transition-tool arguments. The phase transition tool records the handoff but does not create or validate these research files.

{state.evidence_digest}"""
prompt = """
Translate the reference visual language into a reusable design system."""
continuation_prompt = "Call submit_design_system(summary) now."

[[phases.transitions]]
tool = "submit_design_system"
description = "Record the design-system research handoff and advance."
effect = "reconstruct_site"
params = [
  { name = "summary", description = "Short description of the design-system decisions written to the design-system Markdown files." },
]

[[phases]]
name = "research_gate"
agent_type = "auto"
max_turns = 15
max_attempts = 5
max_iterations = 20
next = "bootstrap"
on_reject = "research_gate"
mode_override = "yolo"
extra_tools = ["reconstruct"]
system_prompt = """
You are in the RESEARCH_GATE phase of reconstruct_site. This is a hard boundary before implementation. Review every route, viewport, visual state, interaction trace, responsive observation, asset, and measurement in the coverage report. Do not write application code. If complete, call approve_research_baseline(summary, baseline_artifact_id). If only explicitly unavailable cells remain, call approve_degraded_research(exception_ids, rationale, baseline_artifact_id). Otherwise call reject_research_baseline(findings, target_phase). Prose never advances this gate.

{state.evidence_digest}"""
prompt = """
Review the research coverage report and approve the current baseline, approve explicit degraded exceptions, or reject with the earliest phase that can resolve the findings.

{state.research_report}"""
continuation_prompt = "The previous gate submission was not accepted: {state.research_gate_failure}. Do not repeat the same approval until the issue is resolved.\n\n{state.research_report}"

[[phases.transitions]]
tool = "approve_research_baseline"
description = "Approve a complete fidelity baseline and start implementation."
effect = "reconstruct_site"
params = [
  { name = "summary", description = "Why the baseline is complete." },
  { name = "baseline_artifact_id", description = "The current baseline id from the [EVIDENCE DIGEST]." },
]

[[phases.transitions]]
tool = "approve_degraded_research"
description = "Approve only explicitly unavailable research cells."
effect = "reconstruct_site"
params = [
  { name = "exception_ids", type = "array", items = "string", required = false, description = "Each accepted unavailable cell." },
  { name = "rationale", description = "Why the limitation is acceptable." },
  { name = "baseline_artifact_id", description = "The current baseline id from the [EVIDENCE DIGEST]." },
]

[[phases.transitions]]
tool = "reject_research_baseline"
description = "Reject the baseline and request targeted research re-entry."
outcome = "rejected"
effect = "reconstruct_site"
params = [
  { name = "findings", type = "array", items = "string", description = "The missing or contradictory observations." },
  { name = "target_phase", description = "The earliest phase that can resolve the findings." },
]

[[phases]]
name = "bootstrap"
agent_type = "auto"
max_turns = 25
max_attempts = 5
next = "global_shell"
mode_override = "yolo"
extra_tools = ["reconstruct"]
system_prompt = """
You are in the BOOTSTRAP phase of reconstruct_site. Create or configure the Next.js project (App Router, TypeScript, Tailwind CSS, shadcn/ui, TanStack Query, lint, format). Verify TypeScript compiles, Tailwind works, shadcn/ui is configured, TanStack Query is installed and configured, linting and formatting work, the dev server starts, and a production build succeeds. Do NOT proceed until the foundation is healthy. Then call confirm_bootstrap_healthy(summary). Only a successful transition-tool call changes phase; prose never advances the workflow.

{state.evidence_digest}"""
prompt = """
Scaffold the Next.js project in {state.target_directory}."""
continuation_prompt = "Call confirm_bootstrap_healthy(summary) now."

[[phases.transitions]]
tool = "confirm_bootstrap_healthy"
description = "Confirm the Next.js foundation is healthy and advance."
effect = "reconstruct_site"
params = [
  { name = "summary", description = "Evidence that TypeScript, Tailwind, shadcn/ui, TanStack Query, lint, format, dev server, and production build all work." },
]

[[phases]]
name = "global_shell"
agent_type = "auto"
max_turns = 30
max_attempts = 5
next = "component_system"
mode_override = "yolo"
model_param = "shell_model"
extra_tools = ["reconstruct"]
system_prompt = """
You are in the GLOBAL_SHELL phase of reconstruct_site. Implement the root layout, header, navigation, footer, global container, typography, theme, responsive navigation, and global loading/error handling. The global shell should be visually close to the reference BEFORE implementing individual pages. Then call confirm_global_shell(summary). Only a successful transition-tool call changes phase; prose never advances the workflow.

{state.evidence_digest}"""
prompt = """
Implement the global shell: root layout, header, navigation, footer, global container, typography, theme, responsive navigation, global loading/error handling."""
continuation_prompt = "Call confirm_global_shell(summary) now."

[[phases.transitions]]
tool = "confirm_global_shell"
description = "Confirm the global shell and advance."
effect = "reconstruct_site"
params = [
  { name = "summary", description = "Root layout, header/nav/footer, global container, typography, theme, responsive navigation, global loading/error handling — visually close to the reference." },
]

[[phases]]
name = "component_system"
agent_type = "auto"
max_turns = 30
max_attempts = 5
next = "page"
mode_override = "yolo"
model_param = "components_model"
extra_tools = ["reconstruct"]
system_prompt = """
You are in the COMPONENT_SYSTEM phase of reconstruct_site. Identify repeated UI patterns and implement reusable components (Button, Card, Badge, Input, Select, Dialog, Dropdown, Tabs, Table, Pagination, Navbar, Sidebar, Breadcrumb, EmptyState, LoadingState, ErrorState). Prefer customized shadcn/ui primitives; do not create one-off implementations for clearly repeating patterns. Then call confirm_component_system(summary). Only a successful transition-tool call changes phase; prose never advances the workflow.

{state.evidence_digest}"""
prompt = """
Implement the shared component system over customized shadcn/ui primitives."""
continuation_prompt = "Call confirm_component_system(summary) now."

[[phases.transitions]]
tool = "confirm_component_system"
description = "Confirm the shared component library and advance."
effect = "reconstruct_site"
params = [
  { name = "summary", description = "Repeated UI patterns implemented as reusable components over customized shadcn/ui primitives (Button, Card, Badge, Input, Select, Dialog, Dropdown, Tabs, Table, Pagination, Navbar, Sidebar, Breadcrumb, EmptyState, LoadingState, ErrorState, ...)." },
]

[[phases]]
name = "page"
agent_type = "auto"
max_turns = 40
max_attempts = 5
max_iterations = 1000
next = "data_layer"
mode_override = "yolo"
extra_tools = ["reconstruct"]
system_prompt = """
You are in the PAGE phase of reconstruct_site implementing route '{state.page_route}'. Re-inspect the corresponding reference page, then implement: layout, content, responsive behaviour, interactions, data fetching, loading states, and error states. Compare visually and fix discrepancies. A page is NOT complete merely because it renders. Then call complete_page(page_route, summary) with page_route='{state.page_route}'. Only a successful transition-tool call changes phase; prose never advances the workflow.

{state.evidence_digest}"""
prompt = """
Implement route {state.page_route} (page {state.page_number} of {state.page_count}).
Reference URL: {state.reference_url}"""
continuation_prompt = "Call complete_page('{state.page_route}', summary) now."

[[phases.transitions]]
tool = "complete_page"
description = "Mark the current page route as implemented and advance to the next."
effect = "reconstruct_site"
params = [
  { name = "page_route", description = "The exact route that was implemented." },
  { name = "summary", description = "Layout, content, responsive, interactions, data fetching, loading/error states implemented; discrepancies fixed." },
]

[[phases]]
name = "data_layer"
agent_type = "auto"
max_turns = 30
max_attempts = 5
next = "responsive_pass"
mode_override = "yolo"
model_param = "data_model"
extra_tools = ["reconstruct"]
system_prompt = """
You are in the DATA_LAYER phase of reconstruct_site. Where the reference uses dynamic data, reproduce the behaviour with TanStack Query: query functions, query keys, mutations, cache behaviour, loading states, error handling, invalidation, pagination/infinite queries. Keep data access separate from presentation (UI → TanStack Query → API abstraction → backend/API). If the real backend is unavailable, create a clean mock/data abstraction rather than hardcoding API behaviour into components. Then call confirm_data_layer(summary). Only a successful transition-tool call changes phase; prose never advances the workflow.

{state.evidence_digest}"""
prompt = """
Implement the TanStack Query data layer."""
continuation_prompt = "Call confirm_data_layer(summary) now."

[[phases.transitions]]
tool = "confirm_data_layer"
description = "Confirm the TanStack Query data layer and advance."
effect = "reconstruct_site"
params = [
  { name = "summary", description = "Query functions/keys/mutations/cache/loading/error/invalidation/pagination/infinite; data separated from presentation; clean mock/data abstraction when backend unavailable." },
