[[phases]]
name = "compile"
agent_type = "auto"
max_turns = 15
max_attempts = 5
mode_override = "yolo"
extra_tools = ["book"]
system_prompt = """
make_book contract:
- Keep this workflow policy and the deterministic tool schemas stable across \
every phase and retry.
- Treat phase prompts, chapter metadata, research, artifact paths, questions, \
answers, and validation results as dynamic context.
- Use the phase transition tools exactly as declared. A phase advances only \
after its success or rejection tool is called.
- Preserve all generated files so a resumed run can continue from its \
recorded phase.

You are in the COMPILE phase of make_book. Before building, call \
list_build_book_reference() and then read the relevant ranges with \
read_build_book_reference(start_line=..., end_line=...): the reference is the \
source of xaft's book builder, so it tells you exactly how sources are \
discovered, how page breaks, images and the generated table of contents are \
handled, and what each output contains.

Typeset all written chapters into a polished EPUB, a single self-contained \
HTML book and — when pandoc is installed — a PDF, preserving every kind of rich \
content.

Title: {state.book_title}
Author: {state.book_author}
Rich content: {state.book_content_types}
Chapter files:
{state.book_chapter_files}
Front matter (preface; the TOC is generated; the cover is user-supplied):
{state.book_front_matter_files}
Back matter (index):
{state.book_back_matter_files}
Asset files (images/figures the chapters reference):
{state.book_asset_files}

BOOK POLISH — the finished book must look like a real published book. The \
preface and index page were built by the FRONT_MATTER and BACK_MATTER phases; \
create_build_book generates the TOC from the chapter headings — do NOT \
hand-write or rebuild the TOC. The COVER page is supplied by the END USER \
(<output_dir>/assets/cover.png or cover.jpg); create_build_book places it as \
page 1 when it exists — do NOT generate, design, or rebuild it.
  PAGE BREAKS (mandatory): every chapter, the preface and the index begin on a \
new page. Each source keeps its raw '\\newpage' line right after its '# ' \
title; create_build_book starts every source file on its own page in the EPUB \
and HTML and passes '\\newpage' to pandoc's LaTeX for the PDF.
  HEADINGS: verify the three heading rules across the sources: (1) NO 'Chapter \
N:' prefixed headings anywhere (chapter titles are bare); (2) every '## ' \
section subheading is UNIQUE across ALL chapters (grep the chapter sources and \
confirm no duplicate heading text); (3) one '# ' title per source.
  KDP METADATA (mandatory): write a <output_dir>/metadata.toml that lists the \
Amazon KDP listing metadata: title, subtitle, description, and keywords with \
at most 7 keywords or short phrases (Amazon allows up to 7). Example:
      title = "The Book Title"
      subtitle = "A Practical Guide"
      description = "A short, compelling blurb for the Amazon listing."
      keywords = ["keyword one", "keyword two", "keyword three"]

BUILD (mandatory): call create_build_book(). It compiles front-matter/, \
chapters/ and back-matter/ (sorted by file name, contents.md excluded) into \
<output_dir>/dist/: <title-slug>.epub (EPUB 3 with navigation and an \
accent-coloured stylesheet), <title-slug>.html (one self-contained file with \
images embedded), <title-slug>.md (the combined Markdown) and \
<title-slug>.pdf when pandoc is on PATH — it reports clearly when pandoc is \
missing or the PDF build failed. It also writes <output_dir>/build_book.sh to \
rebuild the PDF and EPUB with pandoc outside a session. Re-run it after \
every source fix: a stale build is refused.

VALIDATE the outputs it reports before you confirm: every chapter title \
appears, images are embedded (it lists missing images), math is kept, code \
blocks keep their language tags, tables render as tables, and inline citations \
like [RFC 8446] remain visible. Fix the sources and rebuild when anything is \
wrong.

On success call mark_book_complete(summary=...); the runner validates the \
build record and the dist/ outputs (one EPUB with mimetype and OPF, the HTML, \
and the PDF whenever the build produced one, all from the current sources). On \
an unrecoverable failure call reject_book(summary=...) with a concise \
diagnosis; the run ends without a book. You MUST call one."""
prompt = """
Compile the finished book into an EPUB, an HTML book and (with pandoc) a PDF.

Title: {state.book_title}
Author: {state.book_author}
Output dir: {state.book_output_dir}
Rich content: {state.book_content_types}
Chapter files:
{state.book_chapter_files}"""
continuation_prompt = "Call mark_book_complete(summary=...) or reject_book(summary=...) now."

[[phases.transitions]]
tool = "mark_book_complete"
description = "Discover, validate, and accept the compiled book under dist/."
effect = "book_mark_complete"
end = true
params = [
  { name = "summary", description = "What was built and verified." },
]

[[phases.transitions]]
tool = "reject_book"
description = "Record a compile failure summary and end the run without a book."
outcome = "exit"
params = [
  { name = "summary", description = "A concise diagnosis of what failed." },
]
