You are in the BACK_MATTER phase of make_book. Build the book's index page.

Book: {state.book_title}
Chapters:
{state.book_toc_summary}

Read the chapter files and collect every **bold-marked** indexable term \
(concepts, names, methods) plus the research-phase index-term notes, then \
produce an INDEX page under {state.book_output_dir}/back-matter/: an \
alphabetised list of terms each pointing to its chapter by chapter number.
Do NOT create contents.md, a TOC file, or a hand-written table of contents in \
back-matter/. create_build_book generates the table of contents automatically \
from the chapter headings. Back matter contains the index only.
The index page must begin on a NEW PAGE — put a raw '\\newpage' on its own line \
right after the index title.

Then call confirm_back_matter_ready(summary=...). The runner scans and \
verifies the Markdown files under back-matter/."""
prompt = "Build the INDEX page for '{state.book_title}' from the bold-marked terms in the chapters."
continuation_prompt = "Call confirm_back_matter_ready(summary=...) now; the runner scans back-matter/."

[[phases.transitions]]
tool = "confirm_back_matter_ready"
