- Use the phase transition tools exactly as declared. A phase advances only \
after its success or rejection tool is called.
- Preserve all generated files so a resumed run can continue from its \
recorded phase.

You are in the LAYOUT_REVIEW phase of make_book. Inspect all completed chapter \
sources and correct the existing Markdown and asset references before handing \
off. Do not create a contents.md file: create_build_book generates the TOC.

Book sources: {state.book_output_dir}

LAYOUT CONTRACT (mandatory): every image and diagram that a book source \
references must fit within 6.175in rendered width (95% of the 6.5in content \
width) and must not exceed 8.05in of rendered height, which is 70% of the \
11.5in page. Use explicit Markdown width/height attributes when needed, \
preserve aspect ratio, and resize or crop oversized source files. Every \
Markdown table must also fit within 6.175in width and 8.05in height: split very \
wide or tall tables into readable tables rather than allowing overflow or an \
unreadable tiny font. Keep captions with their media.
The transition tool is verification-only. Use normal filesystem tools to edit \
files, then call confirm_layout_ready(summary=...) with a concise summary. The \
runner derives the source inventory and rejects violations."""
prompt = "Review all completed chapter sources for image, diagram, and table layout before continuing."
continuation_prompt = "Call confirm_layout_ready(summary=...) after correcting every reported layout violation."

[[phases.transitions]]
tool = "confirm_layout_ready"
description = "Verify image, diagram, and table bounds before the next phase."
effect = "book_confirm_layout"
params = [
  { name = "summary", description = "A concise summary of the layout corrections." },
]

[[phases]]
name = "front_matter"
agent_type = "auto"
max_turns = 15
max_attempts = 5
next = "back_matter"
mode_override = "yolo"
system_prompt = """
make_book contract:
- Keep this workflow policy and the deterministic tool schemas stable across \
every phase and retry.
- Treat phase prompts, chapter metadata, research, artifact paths, questions, \
answers, and validation results as dynamic context.
- Use the phase transition tools exactly as declared. A phase advances only \
after its success or rejection tool is called.
- Preserve all generated files so a resumed run can continue from its \
recorded phase.

You are in the FRONT_MATTER phase of make_book. Build the book's front-matter \
pages so the finished book looks like a real published book.

Book: {state.book_title}
Author: {state.book_author}
Chapters:
{state.book_toc_summary}

Create the preface as a Markdown file under {state.book_output_dir}/front-matter/:
NOTE: the COVER page is supplied by the END USER (e.g. \
<output_dir>/assets/cover.png). Do NOT build, generate, or design a cover page \
— create_build_book places the user-supplied cover as page 1 / the library \
cover.
PREFACE: write a short preface (why this book, who it is for, what the reader \
will learn). Do NOT create contents.md, any other hand-written TOC, or a TOC \
page container. create_build_book generates the real table of contents from \
the chapter headings.
Use a clean, consistent style. The compile phase assembles the preface, then \
the chapters; create_build_book inserts the generated TOC after the cover and \
before the preface.
PAGE BREAKS: the user-supplied cover is page 1 and carries NO leading page \
break (it would create a blank first page); the preface must begin on a new \
page — put a raw '\\newpage' on its own line right after the '# ' title in the \
preface file. Do not create a contents file to hold a page break.

Then call confirm_front_matter_ready(summary=...). The runner scans and \
verifies the Markdown files under front-matter/."""
prompt = "Build the front-matter preface for '{state.book_title}'."
continuation_prompt = "Call confirm_front_matter_ready(summary=...) now; the runner scans front-matter/."

[[phases.transitions]]
tool = "confirm_front_matter_ready"
description = "Scan front-matter/ and record its Markdown files."
effect = "book_confirm_front_matter"
params = [
  { name = "summary", description = "A concise summary of the front matter written." },
]

[[phases]]
name = "back_matter"
agent_type = "auto"
max_turns = 15
max_attempts = 5
next = "final_layout_review"
mode_override = "yolo"
system_prompt = """
make_book contract:
- Keep this workflow policy and the deterministic tool schemas stable across \
every phase and retry.
- Treat phase prompts, chapter metadata, research, artifact paths, questions, \
answers, and validation results as dynamic context.
- Use the phase transition tools exactly as declared. A phase advances only \
after its success or rejection tool is called.
- Preserve all generated files so a resumed run can continue from its \
