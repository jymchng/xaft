[workspace]
members = [".", "crates/xaft-config", "crates/xaft-cli", "crates/xaft-runtime", "crates/xaft-tools", "crates/xaft-agent", "crates/xaft-agents", "crates/xaft-tui", "crates/xaft-session", "crates/xaft-memory", "crates/xaft-skills", "crates/xaft-mcp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"

[workspace.dependencies]
# xaft crates
xaft-config  = { path = "crates/xaft-config" }
xaft-cli     = { path = "crates/xaft-cli" }
xaft-runtime = { path = "crates/xaft-runtime" }
xaft-tools   = { path = "crates/xaft-tools" }
xaft-agents  = { path = "crates/xaft-agents" }
xaft-mcp     = { path = "crates/xaft-mcp" }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }

[package]
name = "xaft"
version.workspace = true
edition.workspace = true

[[bin]]
name = "xaft"
path = "src/main.rs"

[dependencies]
xaft-cli     = { workspace = true }
xaft-config  = { workspace = true }
xaft-runtime = { workspace = true }
xaft-session = { path = "crates/xaft-session" }
xaft-memory  = { path = "crates/xaft-memory" }
xaft-skills  = { path = "crates/xaft-skills" }
# The self-introspection tools' embedded corpus is installed from `main.rs`.
xaft-tools   = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }

[build-dependencies]
# `build.rs` packs docs/ and the Rust source into the introspection corpus
# with xaft-tools' own archive code, which compresses with miniz_oxide.
miniz_oxide  = "0.9"

# The corpus build script DEFLATEs ~9 MB on every source change. Build scripts
# and their dependencies default to opt-level 0, where that takes seconds;
# optimising this one small crate (in both contexts) makes it fast.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3
